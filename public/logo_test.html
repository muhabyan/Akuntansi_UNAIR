<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AKS1 Logo Test - Bandingin sama aslinya</title>
  <style>
    body { 
      display: flex; gap: 40px; flex-wrap: wrap;
      justify-content: center; align-items: center; 
      min-height: 100vh; background: #f5f5f5; margin: 0; padding: 40px;
      font-family: sans-serif;
    }
    .card {
      background: white; border-radius: 16px; padding: 24px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.1); text-align: center;
    }
    .card h3 { margin: 0 0 16px; color: #333; }
    svg { background: white; border: 1px solid #e0e0e0; border-radius: 8px; }
  </style>
</head>
<body>
  <div class="card">
    <h3>Versi Baru (Proporsi Diperbaiki)</h3>
    <svg viewBox="0 0 100 100" width="400" height="400">
      <!-- Triangle (behind) -->
      <path d="M 48 37 L 5 88 L 90 88 Z" stroke="#FACC15" stroke-width="22" fill="none" stroke-linejoin="miter" stroke-miterlimit="10"/>
      <path d="M 48 37 L 5 88 L 90 88 Z" stroke="#2563EB" stroke-width="18" fill="none" stroke-linejoin="miter" stroke-miterlimit="10"/>
      <path d="M 48 37 L 5 88 L 90 88 Z" stroke="#FACC15" stroke-width="14" fill="none" stroke-linejoin="miter" stroke-miterlimit="10"/>
      <path d="M 48 37 L 5 88 L 90 88 Z" stroke="#2563EB" stroke-width="10" fill="none" stroke-linejoin="miter" stroke-miterlimit="10"/>
      <path d="M 48 37 L 5 88 L 90 88 Z" stroke="#FACC15" stroke-width="6" fill="none" stroke-linejoin="miter" stroke-miterlimit="10"/>
      <path d="M 48 37 L 5 88 L 90 88 Z" stroke="#2563EB" stroke-width="2" fill="none" stroke-linejoin="miter" stroke-miterlimit="10"/>
      
      <!-- Right leg extension (in front) - goes to UPPER LEFT -->
      <line x1="90" y1="88" x2="22" y2="6" stroke="#FACC15" stroke-width="22" stroke-linecap="butt"/>
      <line x1="90" y1="88" x2="22" y2="6" stroke="#2563EB" stroke-width="18" stroke-linecap="butt"/>
      <line x1="90" y1="88" x2="22" y2="6" stroke="#FACC15" stroke-width="14" stroke-linecap="butt"/>
      <line x1="90" y1="88" x2="22" y2="6" stroke="#2563EB" stroke-width="10" stroke-linecap="butt"/>
      <line x1="90" y1="88" x2="22" y2="6" stroke="#FACC15" stroke-width="6" stroke-linecap="butt"/>
      <line x1="90" y1="88" x2="22" y2="6" stroke="#2563EB" stroke-width="2" stroke-linecap="butt"/>
    </svg>
  </div>
</body>
</html>
