<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="#f8fafc" rx="8"/>
  
  <!-- Axes -->
  <line x1="50" y1="250" x2="350" y2="250" stroke="#334155" stroke-width="2" />
  <line x1="50" y1="250" x2="50" y2="50" stroke="#334155" stroke-width="2" />
  
  <!-- Labels -->
  <text x="200" y="285" font-family="sans-serif" font-size="14" fill="#334155" text-anchor="middle">Price (X)</text>
  <text x="25" y="150" font-family="sans-serif" font-size="14" fill="#334155" transform="rotate(-90 25 150)" text-anchor="middle">Quantity (Y)</text>
  
  <!-- Points (Negative correlation: high X -> low Y, low X -> high Y) -->
  <circle cx="80" cy="80" r="5" fill="#3b82f6" opacity="0.8"/>
  <circle cx="100" cy="110" r="5" fill="#3b82f6" opacity="0.8"/>
  <circle cx="110" cy="90" r="5" fill="#3b82f6" opacity="0.8"/>
  <circle cx="130" cy="130" r="5" fill="#3b82f6" opacity="0.8"/>
  <circle cx="150" cy="120" r="5" fill="#3b82f6" opacity="0.8"/>
  <circle cx="180" cy="150" r="5" fill="#3b82f6" opacity="0.8"/>
  <circle cx="210" cy="170" r="5" fill="#3b82f6" opacity="0.8"/>
  <circle cx="230" cy="160" r="5" fill="#3b82f6" opacity="0.8"/>
  <circle cx="250" cy="200" r="5" fill="#3b82f6" opacity="0.8"/>
  <circle cx="280" cy="210" r="5" fill="#3b82f6" opacity="0.8"/>
  <circle cx="310" cy="230" r="5" fill="#3b82f6" opacity="0.8"/>
  <circle cx="330" cy="220" r="5" fill="#3b82f6" opacity="0.8"/>
  
  <!-- Trend line (optional but good for showing the strong negative correlation) -->
  <line x1="70" y1="80" x2="340" y2="235" stroke="#ef4444" stroke-width="2" stroke-dasharray="5,5" opacity="0.5"/>
</svg>
